[package]
name = "haunted_hollow"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
ash = "0.38"
ash-window = "0.13"
font8x8 = "0.3"
glam = "0.29"
libc = "0.2"
libloading = "0.8"
openxr = "0.22"
raw-window-handle = "0.6"
winit = "0.30"
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }

# The Steam Frame's runtime has no OpenXR loader to dlopen, so arm64 builds link one in.
[target.'cfg(target_arch = "aarch64")'.dependencies]
openxr = { version = "0.22", features = ["static"] }

[build-dependencies]
naga = { version = "25", features = ["wgsl-in", "spv-out"] }

